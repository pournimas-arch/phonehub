name: phonehub
description: PhoneHub - Second-hand Mobile E-commerce App (Customer App UI)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.0.0
  crypto: ^3.0.7
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  # NEW: push notifications. If pub reports a version clash with firebase_core,
  # run `flutter pub add firebase_messaging` and it will pick the matching version.
  firebase_messaging: ^16.0.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  geocoding: ^5.0.0
  geolocator: ^14.1.1
  google_maps_flutter: ^2.18.1
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true